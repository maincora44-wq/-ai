name: Refresh public market data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-data-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch public market data
        run: python scripts/update_market_data.py
      - name: Commit feed when changed
        run: |
          if git diff --quiet -- market-data.json; then
            echo "No market-data change."
            exit 0
          fi
          git config user.name "investment-os-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data.json
          git commit -m "Update public market data"
          git push
