<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09111f">
<link rel="manifest" href="./widget.webmanifest">
<title>Investment OS</title>
<style>
:root{color-scheme:dark;--bg:#09111f;--card:#121f33;--card2:#182941;--line:#243952;--muted:#90a5bf;--text:#f4f7fb;--blue:#65a3ff;--green:#65dfad;--amber:#f4c76a;--red:#ff8d99}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{min-height:100dvh}
main{width:min(100%,560px);margin:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
h1{font-size:21px;line-height:1.1;margin:0 0 4px;letter-spacing:-.4px}
.muted{color:var(--muted);font-size:11px}
button,a{font:inherit}
.iconbtn{border:1px solid var(--line);background:#101d2e;color:#fff;border-radius:10px;padding:8px 10px}
.card{background:linear-gradient(180deg,#14243a,#101d30);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;overflow:hidden}
.hero{padding:15px}
.eyebrow{font-size:11px;color:#9fb0c8;margin-bottom:3px}
.total{font-weight:850;font-size:clamp(28px,8vw,40px);letter-spacing:-1.4px;line-height:1.05}
.hero-meta{display:flex;justify-content:space-between;gap:8px;align-items:end;margin-top:9px}
.hero-meta b{display:block;font-size:16px}
.hero-meta span{font-size:10px;color:var(--muted)}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.metric{background:var(--card2);border-radius:12px;padding:9px;min-width:0}
.metric .label{font-size:10px;color:#9fb0c8}
.metric strong{font-size:13px;display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title{font-size:12px;color:#9fb0c8;margin:0 0 9px;font-weight:750}
.allocbar{display:flex;height:10px;background:#27384e;border-radius:999px;overflow:hidden;margin-bottom:9px}
.seg{height:100%}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.left{min-width:0}
.name{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.amount{text-align:right;font-size:12px;font-weight:800;white-space:nowrap}
.pct{font-size:10px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.regime{background:var(--card2);border-radius:12px;padding:10px}
.regime-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
.regime b{font-size:15px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:850}
.on{background:#103e32;color:#70e7b1}.off{background:#49232d;color:#ff9aaa}.neutral{background:#403a20;color:#f6d873}.warn{background:#4a3020;color:#ffc070}.info{background:#173459;color:#83b8ff}
.flagwrap{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.focus{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.focus:first-child{border-top:0}
.focus strong{font-size:13px}.focus small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.signal{font-size:11px;font-weight:850}
.good{color:var(--green)}.caution{color:var(--amber)}.risk{color:var(--red)}
.footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:3px}
.footer a{border-radius:12px;padding:11px 8px;text-decoration:none;text-align:center;font-weight:800;font-size:12px;color:#eef5ff;background:#1c3352;border:1px solid #2e4969}
.footer a.primary{background:#2e6fe4;border-color:#2e6fe4}
.mask{filter:blur(8px);user-select:none}
.empty{padding:30px 16px;text-align:center;line-height:1.6;color:#afbdd0}
.empty input{width:100%;margin-top:12px}
.note{font-size:9px;color:#70859f;margin-top:8px;line-height:1.35}
@media(max-width:360px){main{padding:9px}.metric-grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.total{font-size:30px}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Investment OS</h1><div class="muted" id="asof">Local portfolio dashboard</div></div>
  <button class="iconbtn" id="privacy" aria-label="금액 숨기기">🙈</button>
</header>

<section class="card hero">
  <div class="eyebrow">관측 투자자산</div>
  <div class="total sensitive" id="total">—</div>
  <div class="hero-meta">
    <div><span>주 운용계좌</span><b class="sensitive" id="active">—</b></div>
    <div style="text-align:right"><span>데이터 품질</span><b id="quality">—</b></div>
  </div>
</section>

<section class="metric-grid">
  <div class="metric"><span class="label">퇴직계좌</span><strong class="sensitive" id="retirement">—</strong></div>
  <div class="metric"><span class="label">ISA</span><strong class="sensitive" id="isa">—</strong></div>
  <div class="metric"><span class="label">임직원주식</span><strong class="sensitive" id="employee">—</strong></div>
</section>

<section class="card">
  <p class="title">자산 구조</p>
  <div class="allocbar" id="allocbar"></div>
  <div id="accounts"></div>
</section>

<section class="card">
  <p class="title">핵심 익스포저</p>
  <div id="top"></div>
</section>

<section class="card">
  <p class="title">투자 체크포인트</p>
  <div id="focus"></div>
</section>

<section class="card">
  <p class="title">시장 레짐 · 수동 입력 기준</p>
  <div class="two">
    <div class="regime"><div class="regime-head"><span class="muted">US</span><span id="usRegime">—</span></div><b id="usVal">—</b><div class="muted">vs 200DMA</div></div>
    <div class="regime"><div class="regime-head"><span class="muted">Korea</span><span id="krRegime">—</span></div><b id="krVal">—</b><div class="muted">vs 200DMA</div></div>
  </div>
  <div class="metric-grid" style="margin-top:7px">
    <div class="metric"><span class="label">USD/KRW</span><strong id="fx">—</strong></div>
    <div class="metric"><span class="label">US 10Y 5D</span><strong id="rates">—</strong></div>
    <div class="metric"><span class="label">외국인 5D</span><strong id="flow">—</strong></div>
  </div>
  <div class="flagwrap" id="flags"></div>
  <div class="note" id="marketFresh">시장 데이터 날짜 확인 필요</div>
</section>

<section class="footer">
  <a href="./">전체 Portfolio Lab</a>
  <a class="primary" href="./?tab=regime">시장 입력/업데이트</a>
</section>
<div class="note" id="status">개인 자산 숫자는 이 브라우저 localStorage에서만 읽습니다.</div>
</main>
<script src="./widget.js" defer></script>
</body>
</html>
