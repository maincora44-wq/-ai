<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="./widget.webmanifest">
<title>Investment Widget</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}
main{height:100dvh;max-width:560px;margin:auto;padding:12px;display:grid;grid-template-rows:auto auto 1fr auto;gap:9px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0} .sub{font-size:11px;color:#95a6bd}
button,a{border:0;border-radius:10px;background:#20324a;color:#eef4ff;padding:9px 11px;font-weight:700;text-decoration:none}
.eye{width:auto;margin:0;background:#152238}
.card{background:#142136;border:1px solid #233651;border-radius:15px;padding:12px;min-height:0}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.kpi{background:#1b2c45;border-radius:12px;padding:10px}
.label{font-size:11px;color:#9db0c9}.value{font-size:clamp(19px,5vw,26px);font-weight:800;margin-top:3px;letter-spacing:-.5px}
.smallv{font-size:15px;font-weight:750;margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.section-title{font-size:12px;color:#91a4bf;margin:0 0 7px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid #243751}
.row:first-of-type{border-top:0}.name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amt{font-size:12px;font-weight:750;white-space:nowrap}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800}.on{background:#123f33;color:#70e6af}.off{background:#4b2630;color:#ff9dab}.neutral{background:#3d3c27;color:#f3d775}.warn{background:#4a3321;color:#ffbd6e}
.market{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.m{background:#1b2c45;border-radius:10px;padding:8px;text-align:center}.m b{display:block;font-size:13px;margin-top:3px}
.footer{display:flex;gap:7px;align-items:center}.footer a{flex:1;text-align:center;background:#2e6fe4}.fresh{font-size:10px;color:#8396af;flex:1}
.mask{filter:blur(7px);user-select:none}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:#a8b7ca;line-height:1.5}
@media(max-height:720px){main{padding:8px;gap:6px}.card{padding:9px}.row{padding:3px 0}.value{font-size:20px}.hero,.grid{gap:6px}}
</style>
</head>
<body>
<main>
<header><div><h1>📊 Investment Widget</h1><div class="sub" id="asof">로컬 데이터</div></div><button class="eye" id="privacy">👁</button></header>
<section class="hero">
  <div class="kpi"><div class="label">관측 투자자산</div><div class="value sensitive" id="total">—</div><div class="sub">mixed-date subtotal</div></div>
  <div class="kpi"><div class="label">운용 계좌</div><div class="smallv sensitive" id="active">—</div><div class="sub">Comprehensive</div></div>
</section>
<section class="grid" id="content">
  <div class="card">
    <p class="section-title">자산 구조</p>
    <div class="row"><span class="name">퇴직계좌</span><span class="amt sensitive" id="retirement">—</span></div>
    <div class="row"><span class="name">ISA</span><span class="amt sensitive" id="isa">—</span></div>
    <div class="row"><span class="name">임직원주식</span><span class="amt sensitive" id="employee">—</span></div>
    <p class="section-title" style="margin-top:9px">Top exposures</p>
    <div id="top"></div>
  </div>
  <div class="card">
    <p class="section-title">Market regime</p>
    <div class="market">
      <div class="m"><span class="label">US</span><b id="usRegime">—</b></div>
      <div class="m"><span class="label">Korea</span><b id="krRegime">—</b></div>
      <div class="m"><span class="label">USD/KRW</span><b id="fx">—</b></div>
    </div>
    <p class="section-title" style="margin-top:9px">Risk flags</p>
    <div id="flags"></div>
    <p class="section-title" style="margin-top:9px">데이터 날짜</p>
    <div class="row"><span class="name">Portfolio</span><span class="amt" id="pdate">—</span></div>
    <div class="row"><span class="name">Market</span><span class="amt" id="mdate">—</span></div>
  </div>
</section>
<footer class="footer"><div class="fresh" id="status">Same-origin localStorage only</div><a href="./">전체 앱 열기</a></footer>
</main>
<script src="./widget.js" defer></script>
</body></html>
